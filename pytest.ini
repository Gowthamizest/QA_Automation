[pytest]
addopts = --alluredir=reports/allure-results --junitxml=reports/results.xml

log_cli = true
log_cli_level = INFO
log_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

markers =
    smoke: Smoke tests
    regression: Regression tests
    login: Requires login before execution